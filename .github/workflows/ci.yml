name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test the tray companion
        run: cargo test --locked
      - name: Test the release ledger recorder
        run: python3 -m unittest discover -s tests -p 'test_*.py'
